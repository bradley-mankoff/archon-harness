name: archon-efficient
description: "Always-on efficient coding harness: deterministic DAG, OMP hashline, batching, bounded structural scouting, and memory."
provider: pi
worktree:
  enabled: false
evidence_policy:
  required: true

nodes:
  - id: preflight
    bash: >-
      "$HARNESS_BUN" "$HARNESS_ROOT/src/cli.ts" internal preflight
      --cwd "$PWD" --artifacts "$ARTIFACTS_DIR"
    timeout: 240000

  - id: agent
    bash: |
      args=(-p --no-title --cwd "$PWD" --max-time 15m --extension "$HARNESS_EXTENSION")
      if [ -n "${HARNESS_OMP_MODEL:-}" ]; then
        args+=(--model "$HARNESS_OMP_MODEL")
      fi
      if [ -n "${HARNESS_OMP_THINKING:-}" ]; then
        args+=(--thinking "$HARNESS_OMP_THINKING")
      fi
      "$HARNESS_OMP" "${args[@]}" -- "$ARGUMENTS" > "$HARNESS_FINAL_RESPONSE" 2> "$HARNESS_OMP_LOG"
    depends_on: [preflight]
    timeout: 900000

  - id: postflight
    bash: >-
      "$HARNESS_BUN" "$HARNESS_ROOT/src/cli.ts" internal postflight
      --artifacts "$ARTIFACTS_DIR"
    depends_on: [agent]
    timeout: 30000
    trigger_rule: all_success
