name: archon-efficient-pi
description: "[Pi modular] Tura-like efficient coding policy over official Pi with strict hashline, bounded RTK batching, automatic GitNexus context, agentmemory, and concise final output."
provider: pi
worktree:
  enabled: false
evidence_policy:
  required: true

nodes:
  - id: preflight
    bash: |
      mkdir -p "$ARTIFACTS_DIR/harness"
      export HARNESS_AUDIT_PATH="${HARNESS_AUDIT_PATH:-$ARTIFACTS_DIR/harness/audit.jsonl}"
      "$HARNESS_BUN" "$HARNESS_ROOT/src/cli.ts" internal preflight \
        --profile pi-modular --cwd "$PWD"
    timeout: 240000

  - id: agent
    bash: |
      "$HARNESS_BUN" "$HARNESS_ROOT/src/cli.ts" internal agent \
        --profile pi-modular --cwd "$PWD" --artifacts "$ARTIFACTS_DIR" --message "$ARGUMENTS"
    depends_on: [preflight]
    timeout: 900000

  - id: postflight
    bash: |
      export HARNESS_AUDIT_PATH="${HARNESS_AUDIT_PATH:-$ARTIFACTS_DIR/harness/audit.jsonl}"
      "$HARNESS_BUN" "$HARNESS_ROOT/src/cli.ts" internal postflight \
        --profile pi-modular --artifacts "$ARTIFACTS_DIR"
    depends_on: [agent]
    timeout: 30000
    trigger_rule: all_success
