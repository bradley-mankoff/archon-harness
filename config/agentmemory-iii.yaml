workers:
  - name: iii-worker-manager
    config:
      host: 127.0.0.1
      port: ${III_ENGINE_PORT:49134}

  - name: iii-http
    config:
      port: ${III_REST_PORT:3111}
      host: 127.0.0.1
      default_timeout: 180000
      cors:
        allowed_origins:
          - http://localhost:${III_REST_PORT:3111}
          - http://localhost:${III_VIEWER_PORT:3113}
          - http://127.0.0.1:${III_REST_PORT:3111}
          - http://127.0.0.1:${III_VIEWER_PORT:3113}
        allowed_methods: [GET, POST, PUT, DELETE, OPTIONS]

  - name: iii-state
    config:
      adapter:
        name: kv
        config:
          store_method: file_based
          file_path: ./data/state_store.db

  - name: iii-queue
    config:
      adapter:
        name: builtin

  - name: iii-pubsub
    config:
      adapter:
        name: local

  - name: iii-cron
    config:
      adapter:
        name: kv

  - name: iii-stream
    config:
      port: ${III_STREAMS_PORT:3112}
      host: 127.0.0.1
      adapter:
        name: kv
        config:
          store_method: file_based
          file_path: ./data/stream_store

  - name: iii-observability
    config:
      enabled: true
      service_name: agentmemory
      exporter: memory
      sampling_ratio: 0.1
      metrics_enabled: true
      logs_enabled: true
      logs_console_output: false

